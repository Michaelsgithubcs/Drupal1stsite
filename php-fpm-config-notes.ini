; PHP-FPM Configuration Notes for Leo's Carpentry & Designs Drupal Site
; 
; This file documents the key PHP-FPM settings configured for this Drupal installation.
; The actual configuration is in /opt/homebrew/etc/php/8.5/php-fpm.d/www.conf
;
; Key Changes Made:
; ==================
;
; 1. Connection Method: Unix Socket
;    listen = /opt/homebrew/var/run/php-fpm.sock
;    
;    Why: Unix sockets are faster than TCP for local connections
;    Performance: ~15% faster than 127.0.0.1:9000 for same-machine communication
;    Security: Socket file permissions provide additional access control
;
; 2. Socket Permissions
;    listen.owner = mikendlovu
;    listen.group = staff
;    listen.mode = 0666
;    
;    Why: Nginx must be able to read/write to the socket
;    0666 = Read/write for everyone (acceptable for local development)
;    Production: Use 0660 with proper user/group ownership
;
; 3. Process Manager Settings (defaults, documented here for reference)
;    pm = dynamic
;    
;    Why: Dynamically adjusts worker processes based on load
;    Alternatives:
;      - static: Fixed number of workers (best for high, consistent traffic)
;      - ondemand: Spawns workers only when needed (good for low traffic)
;    
;    pm.max_children = 5
;    Why: Maximum worker processes
;    Too low: Requests queue up, site becomes slow
;    Too high: Server runs out of memory
;    Formula: (Available RAM - OS - MySQL - Other) / (PHP worker RAM)
;    Each PHP-FPM worker typically uses 30-50MB for Drupal
;    
;    pm.start_servers = 2
;    Why: Number of workers created at startup
;    Should be: (pm.min_spare_servers + (pm.max_spare_servers - pm.min_spare_servers) / 2)
;    
;    pm.min_spare_servers = 1
;    pm.max_spare_servers = 3
;    Why: Keep workers ready for incoming requests
;    Reduces latency by not waiting for process spawning
;    
;    pm.max_requests = 500
;    Why: Restart workers after this many requests
;    Prevents memory leaks from accumulating
;    Drupal recommendation: 500-1000 requests
;
; 4. PHP Settings for Drupal
;    These are configured in /opt/homebrew/etc/php/8.5/php.ini
;    
;    memory_limit = 256M (minimum 128M, recommended 256M for Drupal)
;    Why: Drupal operations like cache rebuild need significant memory
;    Symptoms if too low: White screen of death, incomplete operations
;    
;    max_execution_time = 300 (5 minutes)
;    Why: Some Drupal operations take time (cron, updates, imports)
;    Must match nginx fastcgi_read_timeout
;    
;    upload_max_filesize = 100M
;    post_max_size = 100M
;    Why: Allow large file uploads (images, videos, documents)
;    Must match nginx client_max_body_size
;    
;    opcache.enable = 1
;    opcache.memory_consumption = 128
;    Why: Caches compiled PHP code, significantly improves performance
;    Drupal generates a lot of PHP code, OPcache is essential
;    
;    opcache.interned_strings_buffer = 8
;    Why: Stores strings used across scripts (reduces memory)
;    
;    opcache.max_accelerated_files = 10000
;    Why: Drupal can have thousands of PHP files (core + modules)
;    
;    opcache.validate_timestamps = 1 (development)
;    opcache.revalidate_freq = 0 (development)
;    Why: Check for file changes on every request during development
;    Production: Set validate_timestamps = 0 for max performance
;
; Required PHP Extensions for Drupal:
; ====================================
; ✓ pdo_mysql - Database connectivity
; ✓ gd - Image manipulation
; ✓ xml - XML parsing
; ✓ mbstring - Multi-byte string handling
; ✓ curl - HTTP requests
; ✓ zip - Archive handling
; ✓ opcache - Performance optimization
;
; Troubleshooting:
; ================
;
; Problem: "502 Bad Gateway"
; Solution: 
;   - Check if PHP-FPM is running: brew services list | grep php
;   - Check socket exists: ls -la /opt/homebrew/var/run/php-fpm.sock
;   - Check socket permissions (should be rw-rw-rw-)
;   - Check PHP-FPM error log: tail -f /opt/homebrew/var/log/php-fpm.log
;
; Problem: "File not found" or blank page
; Solution:
;   - Check nginx root path matches Drupal web directory
;   - Check file permissions: chmod -R 755 web/
;   - Check SCRIPT_FILENAME in nginx config
;
; Problem: "Maximum execution time exceeded"
; Solution:
;   - Increase max_execution_time in php.ini
;   - Increase fastcgi_read_timeout in nginx config
;   - Both must be equal or nginx will timeout first
;
; Problem: Upload fails silently
; Solution:
;   - Check upload_max_filesize and post_max_size in php.ini
;   - Check client_max_body_size in nginx config
;   - Ensure sites/default/files is writable
;
; Performance Tuning:
; ===================
;
; For production with 8GB RAM and consistent traffic:
; pm = static
; pm.max_children = 50
; pm.max_requests = 1000
;
; For production with variable traffic:
; pm = dynamic
; pm.max_children = 75
; pm.start_servers = 10
; pm.min_spare_servers = 5
; pm.max_spare_servers = 15
;
; Memory calculation:
; Each PHP-FPM worker: ~40MB for Drupal
; 50 workers * 40MB = 2GB for PHP-FPM
; Leave 4GB for MySQL, 2GB for OS/cache
;
; Monitoring:
; ===========
;
; Enable PHP-FPM status page (add to www.conf):
; pm.status_path = /fpm-status
;
; Then access via:
; curl http://drupal.local:8080/fpm-status
;
; Shows:
; - Active processes
; - Idle processes
; - Requests per second
; - Slow requests
;
; Testing Configuration:
; ======================
;
; 1. Test PHP-FPM syntax:
;    php-fpm --test
;
; 2. Test PHP-FPM socket connection:
;    echo "<?php phpinfo(); ?>" | php-cgi -b /opt/homebrew/var/run/php-fpm.sock
;
; 3. Monitor PHP-FPM processes:
;    ps aux | grep php-fpm
;
; 4. Watch PHP-FPM log in real-time:
;    tail -f /opt/homebrew/var/log/php-fpm.log
;
