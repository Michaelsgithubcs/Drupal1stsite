# Nginx server block for Leo's Carpentry & Designs Drupal site
# Local development configuration for drupal.local

server {
    # Listen on port 8080 (Homebrew nginx default for non-privileged user)
    # Standard port 80 requires root privileges, so we use 8080
    # To access the site, use: http://drupal.local:8080
    listen 8080;
    
    # Alternative: listen on port 80 if nginx is run with sudo
    # listen 80;
    
    # Server name - the domain this config responds to
    # Matches the entry we'll add to /etc/hosts
    server_name drupal.local;
    
    # Document root - where Drupal files are located
    # Points to the 'web' subdirectory where index.php lives
    # DO NOT point to drupal-site root - must be drupal-site/web/
    root "/Users/mikendlovu/Documents/Drupal Project/drupal-site/web";
    
    # Default file to serve when accessing a directory
    # index.php is required for Drupal's front controller pattern
    index index.php index.html index.htm;
    
    # Character set for HTTP responses
    # UTF-8 ensures proper display of international characters
    charset utf-8;
    
    # Access log location - records all requests to the site
    # Useful for debugging routing issues and monitoring traffic
    # Format: combined includes client IP, request, status, user agent
    access_log /opt/homebrew/var/log/nginx/drupal.local.access.log combined;
    
    # Error log location - records server errors and PHP errors
    # Set to 'warn' level to avoid excessive logging in development
    # Change to 'error' in production to reduce log size
    error_log /opt/homebrew/var/log/nginx/drupal.local.error.log warn;
    
    # Main location block - handles all requests to the site
    location / {
        # try_files is the critical Drupal routing directive
        # $uri - First, try to serve the exact file requested (e.g., images, CSS, JS)
        # $uri/ - Second, try to serve as a directory with index file
        # /index.php?$query_string - Finally, pass to Drupal's front controller
        # This enables clean URLs and Drupal's routing system
        # WITHOUT this, /admin, /node/1, etc. would return 404
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Location block for PHP files - executes PHP via PHP-FPM
    # Matches any .php file in the site
    location ~ \.php$ {
        # Security: prevent processing files outside web root
        # If the requested PHP file doesn't exist, return 404
        # This prevents "/non-existent.php/malicious.php" attacks
        try_files $uri =404;
        
        # Split the URI into script filename and path info
        # Required for proper PATH_INFO handling in PHP
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # PHP-FPM connection - communicates via Unix socket for performance
        # Socket location is defined in PHP-FPM configuration
        # Alternative: fastcgi_pass 127.0.0.1:9000; (TCP connection)
        # Unix sockets are faster for local connections
        fastcgi_pass unix:/opt/homebrew/var/run/php-fpm.sock;
        
        # Default script to execute (required by FastCGI spec)
        fastcgi_index index.php;
        
        # Include standard FastCGI parameters
        # Provides PHP with REQUEST_METHOD, QUERY_STRING, etc.
        include fastcgi_params;
        
        # Override SCRIPT_FILENAME to absolute path
        # $document_root = /Users/mikendlovu/Documents/Drupal Project/drupal-site/web
        # $fastcgi_script_name = /index.php or /core/install.php
        # Combined: full path to PHP file for PHP-FPM to execute
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Pass the original request URI to PHP
        # Drupal uses this for routing and URL generation
        fastcgi_param REQUEST_URI $request_uri;
        
        # Pass the document root to PHP
        # Drupal uses this to locate files and construct paths
        fastcgi_param DOCUMENT_ROOT $document_root;
        
        # FastCGI timeout settings
        # read_timeout: how long to wait for PHP-FPM response
        # 300 seconds (5 min) handles slow Drupal operations like cache rebuild
        # Increase if you see "504 Gateway Timeout" errors
        fastcgi_read_timeout 300;
        
        # Buffer settings for PHP-FPM responses
        # Prevents "upstream sent too big header" errors
        # Drupal can send large headers with many cookies/cache tags
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    
    # Protect private files - deny direct access
    # Drupal stores uploaded files here (configurable)
    # Files should only be served through Drupal's file system
    # Prevents bypassing access controls on private files
    location ~ ^/sites/.*/private/ {
        return 403;
    }
    
    # Protect sensitive files and directories
    # These should never be accessible via web browser
    location ~ ^/sites/[^/]+/files/.*\.php$ {
        # Block PHP execution in files directory
        # Prevents uploaded PHP files from being executed
        # Critical security measure against malicious uploads
        deny all;
    }
    
    # Deny access to specific Drupal files
    # These files contain sensitive information or aren't meant for web access
    location ~ (^|/)\. {
        # Block all hidden files (.htaccess, .git, .env, etc.)
        # Prevents exposure of version control and config files
        return 403;
    }
    
    # Block access to composer files
    # composer.json and composer.lock reveal installed package versions
    # Could be used to identify vulnerable dependencies
    location ~ ^/(composer\.json|composer\.lock|package\.json|package-lock\.json)$ {
        deny all;
        return 404;
    }
    
    # Block access to vendor directory via web
    # Contains all Composer dependencies and autoloader
    # Should only be accessed by PHP, never directly via HTTP
    location ~ ^/vendor/ {
        deny all;
        return 404;
    }
    
    # Block access to README, CHANGELOG, and installation files
    # These files may contain version information or installation instructions
    # Not sensitive but shouldn't be publicly browsable
    location ~ ^/(README|CHANGELOG|INSTALL|LICENSE|MAINTAINERS)\.txt$ {
        deny all;
        return 404;
    }
    
    # Allow access to robots.txt and favicon.ico
    # These are commonly requested and should be publicly accessible
    # log_not_found off: don't log 404s for these (reduces log noise)
    # access_log off: don't log successful requests for these
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
    
    # Optimize static file serving
    # Matches common static file extensions
    # Browsers will cache these for 30 days (2592000 seconds)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|mp3|pdf)$ {
        # Cache-Control header tells browsers to cache files
        # max-age=2592000: cache for 30 days
        # public: allows intermediate caches (CDNs, proxies) to cache
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        
        # Don't log requests for static files (reduces log size)
        access_log off;
        
        # Don't log 404s for missing images/assets
        log_not_found off;
    }
    
    # Gzip compression for text-based files
    # Reduces bandwidth and improves page load times
    # Already enabled globally in nginx.conf but can be tuned here
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Client request limits
    # client_max_body_size: maximum upload size
    # 100M allows large file uploads (images, videos, documents)
    # Increase if users need to upload larger files
    # Must also be set in PHP (upload_max_filesize, post_max_size)
    client_max_body_size 100M;
    
    # Buffer size for client request headers
    # Prevents "client intended to send too large body" errors
    client_body_buffer_size 128k;
}

# Additional notes for future developers:
# 
# 1. Performance tuning:
#    - For high traffic, enable FastCGI caching
#    - Consider using Redis or Memcached for Drupal cache backend
#    - Enable HTTP/2 by adding 'http2' to listen directive
#
# 2. SSL/TLS for production:
#    - Add listen 443 ssl http2;
#    - Configure ssl_certificate and ssl_certificate_key
#    - Redirect HTTP to HTTPS
#    - Use Let's Encrypt for free SSL certificates
#
# 3. Troubleshooting:
#    - If site returns blank page: check error_log and PHP-FPM log
#    - If CSS/JS not loading: check root path and file permissions
#    - If getting 404 on clean URLs: verify try_files directive
#    - If uploads fail: check client_max_body_size and PHP settings
#
# 4. Drupal-specific paths:
#    - /admin - Drupal admin interface
#    - /user - User login/registration
#    - /node/[id] - Content pages
#    - /core/install.php - Installation script (remove after install)
#
# 5. File permissions:
#    - web/ files should be readable by nginx user (usually _www or nginx)
#    - sites/default/files/ must be writable by PHP-FPM user
#    - sites/default/settings.php should be read-only after installation
#
# 6. Testing this configuration:
#    - sudo nginx -t (test syntax)
#    - sudo nginx -s reload (apply changes)
#    - tail -f /opt/homebrew/var/log/nginx/drupal.local.error.log (watch errors)
